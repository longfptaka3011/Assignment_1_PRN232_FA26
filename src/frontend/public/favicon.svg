<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="layerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#bgGrad)" />
  <rect x="3" y="3" width="58" height="58" rx="15" stroke="url(#innerGlow)" stroke-width="1.5" />

  <!-- Layer 1 (bottom track) -->
  <path d="M17 40L32 47.5L47 40" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Layer 2 (middle track) -->
  <path d="M17 32.5L32 40L47 32.5" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Top diamond surface with shadow -->
  <path d="M32 15L47 22.5L32 30L17 22.5Z" fill="url(#cardGrad)" filter="url(#layerShadow)" />
  
  <!-- Vibrant checkmark embedded on top surface -->
  <path d="M26.5 22.5L30.5 26L37.5 18.5" stroke="#4F46E5" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />
</svg>