<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .entity { fill: #f8f9fa; stroke: #6c5ce7; stroke-width: 2; }
      .entity-header { fill: #6c5ce7; }
      .entity-title { fill: white; font-family: Arial, sans-serif; font-weight: bold; font-size: 12px; }
      .attribute { fill: white; font-family: Arial, sans-serif; font-size: 10px; }
      .pk { font-weight: bold; fill: #00b894; }
      .fk { fill: #e17055; }
      .line { stroke: #636e72; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .label { font-family: Arial, sans-serif; font-size: 9px; fill: #636e72; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#636e72" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="white"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2d3436">Task Management System - ERD</text>
  
  <!-- Department Entity -->
  <rect x="50" y="60" width="150" height="120" class="entity" rx="8"/>
  <rect x="50" y="60" width="150" height="25" class="entity-header" rx="8"/>
  <text x="125" y="77" text-anchor="middle" class="entity-title">Department</text>
  <text x="60" y="100" class="attribute pk">Ï DepartmentID (PK)</text>
  <text x="60" y="115" class="attribute">DepartmentName</text>
  <text x="60" y="130" class="attribute">DepartmentDescription</text>
  <text x="60" y="145" class="attribute">IsActive</text>
  <text x="60" y="160" class="attribute">CreatedDate</text>
  
  <!-- Project Entity -->
  <rect x="250" y="60" width="170" height="160" class="entity" rx="8"/>
  <rect x="250" y="60" width="170" height="25" class="entity-header" rx="8"/>
  <text x="335" y="77" text-anchor="middle" class="entity-title">Project</text>
  <text x="260" y="100" class="attribute pk">Ï ProjectID (PK)</text>
  <text x="260" y="115" class="attribute">ProjectName</text>
  <text x="260" y="130" class="attribute">Description</text>
  <text x="260" y="145" class="attribute">StartDate</text>
  <text x="260" y="160" class="attribute">EndDate</text>
  <text x="260" y="175" class="attribute fk">Ï DepartmentID (FK)</text>
  <text x="260" y="190" class="attribute">Status</text>
  <text x="260" y="205" class="attribute">IsActive</text>
  
  <!-- Task Entity -->
  <rect x="470" y="60" width="170" height="190" class="entity" rx="8"/>
  <rect x="470" y="60" width="170" height="25" class="entity-header" rx="8"/>
  <text x="555" y="77" text-anchor="middle" class="entity-title">Task</text>
  <text x="480" y="100" class="attribute pk">Ï TaskID (PK)</text>
  <text x="480" y="115" class="attribute">Title</text>
  <text x="480" y="130" class="attribute">Description</text>
  <text x="480" y="145" class="attribute">Status</text>
  <text x="480" y="160" class="attribute">Priority</text>
  <text x="480" y="175" class="attribute">DueDate</text>
  <text x="480" y="190" class="attribute fk">Ï ProjectID (FK)</text>
  <text x="480" y="205" class="attribute">IsActive</text>
  <text x="480" y="220" class="attribute">CreatedDate</text>
  <text x="480" y="235" class="attribute">ModifiedDate</text>
  
  <!-- Tag Entity -->
  <rect x="680" y="60" width="100" height="80" class="entity" rx="8"/>
  <rect x="680" y="60" width="100" height="25" class="entity-header" rx="8"/>
  <text x="730" y="77" text-anchor="middle" class="entity-title">Tag</text>
  <text x="690" y="100" class="attribute pk">Ï TagID (PK)</text>
  <text x="690" y="115" class="attribute">TagName</text>
  <text x="690" y="130" class="attribute">Color</text>
  
  <!-- TaskTag Junction Table -->
  <rect x="570" y="320" width="120" height="70" class="entity" rx="8"/>
  <rect x="570" y="320" width="120" height="25" class="entity-header" rx="8"/>
  <text x="630" y="337" text-anchor="middle" class="entity-title">TaskTag</text>
  <text x="580" y="360" class="attribute pk">Ï TaskID (FK)</text>
  <text x="580" y="375" class="attribute pk">Ï TagID (FK)</text>
  
  <!-- Relationships -->
  <!-- Department -> Project -->
  <line x1="200" y1="120" x2="250" y2="180" class="line"/>
  <text x="225" y="145" class="label">1 : N</text>
  
  <!-- Project -> Task -->
  <line x1="420" y1="140" x2="470" y2="140" class="line"/>
  <text x="445" y="130" class="label">1 : N</text>
  
  <!-- Task -> TaskTag -->
  <line x1="555" y1="250" x2="630" y2="320" class="line"/>
  <text x="580" y="285" class="label">1 : N</text>
  
  <!-- Tag -> TaskTag -->
  <line x1="680" y1="100" x2="630" y2="350" class="line"/>
  <text x="655" y="220" class="label">1 : N</text>
  
  <!-- Legend -->
  <rect x="50" y="450" width="700" height="130" fill="#f8f9fa" rx="8"/>
  <text x="70" y="475" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2d3436">Legend</text>
  
  <circle cx="90" cy="505" r="6" fill="#00b894"/>
  <text x="110" y="509" font-family="Arial, sans-serif" font-size="11" fill="#636e72">Primary Key (PK)</text>
  
  <circle cx="90" cy="530" r="6" fill="#e17055"/>
  <text x="110" y="534" font-family="Arial, sans-serif" font-size="11" fill="#636e72">Foreign Key (FK)</text>
  
  <text x="300" y="509" font-family="Arial, sans-serif" font-size="11" fill="#636e72">1 : N - One-to-Many relationship</text>
  
  <!-- Enum Values -->
  <text x="70" y="565" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2d3436">Project Status:</text>
  <text x="200" y="565" font-family="Arial, sans-serif" font-size="10" fill="#636e72">0=Not Started, 1=In Progress, 2=Completed, 3=On Hold</text>
  
  <text x="70" y="580" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2d3436">Task Status:</text>
  <text x="200" y="580" font-family="Arial, sans-serif" font-size="10" fill="#636e72">0=To Do, 1=In Progress, 2=Done, 3=Cancelled</text>
  
  <text x="450" y="565" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2d3436">Task Priority:</text>
  <text x="550" y="565" font-family="Arial, sans-serif" font-size="10" fill="#636e72">0=Low, 1=Medium, 2=High, 3=Critical</text>
</svg>
